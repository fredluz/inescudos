<svg xmlns="http://www.w3.org/2000/svg">
  <filter id="food-ink" color-interpolation-filters="sRGB">
    <!-- Extract warm accents, preserving the original transparency and linework. -->
    <feColorMatrix type="matrix" values="
      3 -3 0 0 0
      3 -3 0 0 0
      3 -3 0 0 0
      0  0 0 1 0" />
    <!-- Map the drawing to the menu's dark ink (#32251d) and red (#922c21). -->
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.196078 0.572549" />
      <feFuncG type="table" tableValues="0.145098 0.172549" />
      <feFuncB type="table" tableValues="0.113725 0.129412" />
    </feComponentTransfer>
  </filter>
</svg>
